name: Sumcoinlib 0.0.3 validation

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  dart:
    name: Dart analyzer and Chrome/WASM tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
      - uses: browser-actions/setup-chrome@v1
      - name: Install Dart dependencies
        working-directory: sumcoinlib
        run: dart pub get
      - name: Analyze Dart library
        working-directory: sumcoinlib
        run: dart analyze
      - name: Run Dart tests with bundled WASM
        working-directory: sumcoinlib
        run: dart test -p chrome

  flutter:
    name: Flutter plugin and example static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Resolve local Flutter plugin dependencies
        working-directory: sumcoinlib_flutter
        run: flutter pub get
      - name: Analyze Flutter plugin
        working-directory: sumcoinlib_flutter
        run: flutter analyze
      - name: Resolve local example dependencies
        working-directory: sumcoinlib_flutter/example
        run: flutter pub get
      - name: Analyze Flutter example
        working-directory: sumcoinlib_flutter/example
        run: flutter analyze
